<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }
        div {
            background-color: #fff;
            margin: 10px;
            padding:10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h3 {
            color: #333;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>
    <div>   
        <h3>Jocelyn Gower</h3>
        <p>Result - Every action, thought, and effort you or those around you undertake generates an eternal surplus of misery over well-being.</p>
        <p>Thank you for using our services!</p>
    </div>
    <div>
        <h3>Lucas Gower</h3>
        <p>Result - Imminent death.</p>
        <p>Thank you for using our services!</p>
    </div>
</body>
</html>
